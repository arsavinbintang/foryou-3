<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 16th Birthday Sandrina</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,700;1,400&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    font-family: 'Jost', sans-serif;
    background-color: #000;
    overflow: hidden;
    user-select: none;
}

#loading-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #001122;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #66B2FF;
    transition: opacity 0.5s ease-in-out;
}

#loading-text {
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-align: center;
    animation: blink 1s infinite;
}

.loading-bar-container {
    width: 300px;
    max-width: 80vw;
    height: 10px;
    background: #002b5e;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #66B2FF;
}

#loading-bar {
    width: 0%;
    height: 100%;
    background: #66B2FF;
    transition: width 0.3s;
}

#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
}

#overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0, 15, 35, 0.3) 0%, rgba(0, 10, 25, 0.6) 100%);
    z-index: 1;
}

#bottom-ui {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 3vh;
    z-index: 5;
}

#character-sprite {
    height: 55vh;
    max-width: 90vw;
    object-fit: contain;
    object-position: bottom center;
    margin-bottom: -15px;
    z-index: 3;
    transition: opacity 0.3s ease-in-out;
    filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
    opacity: 0;
}

#dialogue-box {
    position: relative;
    width: 90vw;
    max-width: 1000px;
    height: 26vh;
    min-height: 160px;
    background: linear-gradient(135deg, rgba(0, 30, 75, 0.98) 0%, rgba(0, 10, 30, 0.98) 100%);
    border: 3px solid #66B2FF;
    border-radius: 4px;
    padding: 1.8rem 2.5rem;
    z-index: 4;
    box-shadow: 0px 0px 25px rgba(102, 178, 255, 0.4);
    display: flex;
    flex-direction: column;
}

#speaker-name {
    position: absolute;
    top: -24px;
    left: -10px;
    background-color: #000;
    color: #fff;
    padding: 6px 28px;
    font-size: 1.4rem;
    font-weight: bold;
    border: 2px solid #66B2FF;
    text-transform: uppercase;
    letter-spacing: 2px;
    transform: skewX(-12deg);
    box-shadow: 3px 3px 0 #0044aa;
    z-index: 5;
}

.dialog-nav-container {
    position: absolute;
    top: -24px;
    right: -10px;
    display: flex;
    gap: 5px;
    z-index: 10;
}

.nav-btn {
    background-color: #000;
    color: #fff;
    border: 2px solid #66B2FF;
    padding: 5px 18px;
    font-family: 'Jost', sans-serif;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    transform: skewX(-12deg);
    box-shadow: 3px 3px 0 #0044aa;
    transition: all 0.2s;
    display: none;
}

.nav-btn:hover {
    background-color: #66B2FF;
    color: #000;
}

.nav-btn span {
    display: inline-block;
    transform: skewX(12deg);
}

#dialogue-text {
    color: #fff;
    font-size: 1.35rem;
    line-height: 1.6;
    text-shadow: 1px 1px 3px #000;
    overflow-y: auto;
    flex-grow: 1;
    padding-right: 15px;
}

#dialogue-text::-webkit-scrollbar { width: 6px; }
#dialogue-text::-webkit-scrollbar-thumb { background: #66B2FF; border-radius: 3px; }

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

#choice-container {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    flex-direction: column;
    gap: 15px;
    z-index: 20;
    width: 80%;
    max-width: 600px;
}

.choice-btn {
    background: linear-gradient(135deg, rgba(0, 40, 100, 0.95), rgba(0, 15, 40, 0.95));
    border: 2px solid #66B2FF;
    color: #fff;
    padding: 15px 25px;
    font-size: 1.2rem;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(102, 178, 255, 0.3);
    transition: all 0.2s;
    text-align: center;
}

.choice-btn:hover {
    background: #66B2FF;
    color: #000;
    transform: scale(1.05);
}

#fade-black {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: black;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease-in-out;
}

#letter-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 20;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.letter-paper {
    background: #fdfbf7;
    width: 90%;
    max-width: 500px;
    padding: 25px 20px;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    position: relative;
    color: #111;
    font-family: 'Caveat', cursive;
    display: flex;
    flex-direction: column;
}

.letter-paper::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 2px dashed #d1c7b7;
    border-radius: 2px;
    pointer-events: none;
}

.letter-nav-container {
    position: absolute;
    top: -45px;
    right: 0;
    display: flex;
    gap: 8px;
    z-index: 10;
}

.letter-nav-btn {
    background-color: #2b2b2b;
    color: #fff;
    border: 2px solid #fff;
    padding: 6px 16px;
    font-family: 'Jost', sans-serif;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    transition: all 0.2s;
    display: none;
}

.letter-nav-btn:hover {
    background-color: #e63946;
    color: #fff;
}

#letter-content {
    font-size: 1.4rem;
    line-height: 1.4;
    white-space: pre-wrap;
    min-height: 180px;
    margin-top: 5px;
}

#fireworks-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #02060f;
    z-index: 30;
    display: none;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

#fireworks-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
}

#fireworks-text {
    position: relative;
    z-index: 2;
    text-align: center;
    pointer-events: none;
    padding: 0 6vw;
}

#fw-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.8rem, 12vw, 6.5rem);
    line-height: 1.1;
    color: #fff;
    text-wrap: balance;
    text-shadow: 0 0 10px #ff7aa8, 0 0 30px #ff4f8b, 0 0 60px #ff2a6d;
    animation: fwPop 1.8s ease-out both, fwGlow 2.6s ease-in-out 1.8s infinite;
}

#fw-name {
    font-family: 'Jost', sans-serif;
    font-weight: 700;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #ffd6e5;
    font-size: clamp(1rem, 4vw, 1.8rem);
    margin-top: 14px;
    text-shadow: 0 0 12px rgba(255, 79, 139, 0.8);
    animation: fwFade 2s ease-out 1.2s both;
}

@keyframes fwPop {
    0% { opacity: 0; transform: scale(0.4); }
    60% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes fwGlow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes fwFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

#fw-continue {
    position: absolute;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: rgba(255, 79, 139, 0.15);
    border: 2px solid #ff7aa8;
    color: #fff;
    padding: 12px 36px;
    font-family: 'Jost', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 30px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease-in-out, background 0.2s;
}

#fw-continue.visible {
    opacity: 1;
    pointer-events: auto;
}

#fw-continue:hover {
    background: #ff4f8b;
}

#ending-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #111;
    z-index: 40;
    display: none;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

#ending-photo {
    max-height: 75vh;
    max-width: 85vw;
    border: 12px solid #fff;
    border-bottom-width: 40px;
    border-radius: 2px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    transform: rotate(-2deg);
    transition: transform 0.4s ease-out;
    background-color: #fff;
    object-fit: contain;
}

@media (max-width: 600px) {
    #dialogue-box {
        padding: 1.4rem 1.2rem;
    }
    #dialogue-text {
        font-size: 1.1rem;
    }
    #speaker-name {
        font-size: 1.1rem;
        padding: 5px 18px;
    }
    #loading-text {
        font-size: 1.4rem;
    }
}
</style>
</head>
<body>

<audio id="bgm" src="lagu.mp3" loop></audio>
<audio id="sfx-click" src="https://www.myinstants.com/media/sounds/click.mp3"></audio>

<div id="loading-screen">
    <div id="loading-text">Mempersiapkan Kejutan... <span id="loading-percent">0%</span></div>
    <div class="loading-bar-container">
        <div id="loading-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="overlay"></div>
    <div id="choice-container"></div>

    <div id="bottom-ui">
        <img id="character-sprite" src="" alt="">
        <div id="dialogue-box">
            <div id="speaker-name">Narator</div>
            <div class="dialog-nav-container">
                <button id="dialog-back" class="nav-btn" onclick="goBack(event)"><span>&lt;</span></button>
                <button id="dialog-next" class="nav-btn" onclick="advanceDialogue(event)"><span>&gt;</span></button>
            </div>
            <div id="dialogue-text"></div>
        </div>
    </div>

    <div id="fade-black"></div>
</div>

<div id="letter-screen">
    <div class="letter-paper">
        <div class="letter-nav-container">
            <button id="letter-back" class="letter-nav-btn" onclick="goBack(event)">&lt;</button>
            <button id="letter-next" class="letter-nav-btn" onclick="advanceLetter(event)">&gt;</button>
        </div>
        <div id="letter-content"></div>
    </div>
</div>

<div id="fireworks-screen">
    <canvas id="fireworks-canvas"></canvas>
    <div id="fireworks-text">
        <div id="fw-title">Selamat 16 Years Old</div>
        <div id="fw-name">Sandrina</div>
    </div>
    <button id="fw-continue" onclick="showEnding()">Lanjut</button>
</div>

<div id="ending-screen">
    <img id="ending-photo" src="foto-akhir.png" alt="Foto Kenangan">
</div>

<script>
const assetsToLoad = [
    'background.png',
    'junpei.png',
    'akihiko.png',
    'shinjiro.png',
    'makoto.png',
    'koromaru.png',
    'yukari.png',
    'foto-akhir.png'
];

let loadedAssets = 0;
let loadingFinished = false;

function preloadAssets() {
    if (assetsToLoad.length === 0) {
        finishLoading();
        return;
    }

    assetsToLoad.forEach(src => {
        const img = new Image();
        img.onload = updateLoadingProgress;
        img.onerror = () => {
            console.warn("Gagal memuat gambar: " + src + ". Pastikan nama file persis sama!");
            updateLoadingProgress();
        };
        img.src = src;
    });
}

function updateLoadingProgress() {
    loadedAssets++;
    const percent = Math.floor((loadedAssets / assetsToLoad.length) * 100);
    document.getElementById('loading-percent').textContent = percent + "%";
    document.getElementById('loading-bar').style.width = percent + "%";

    if (loadedAssets === assetsToLoad.length) {
        setTimeout(finishLoading, 400);
    }
}

function finishLoading() {
    if (loadingFinished) return;
    loadingFinished = true;

    const loader = document.getElementById('loading-screen');
    loader.style.opacity = '0';
    setTimeout(() => {
        loader.style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        renderDialogue(currentLine);
    }, 400);
}

window.addEventListener('load', preloadAssets);

const bgm = document.getElementById('bgm');
const clickSfx = document.getElementById('sfx-click');

let audioStarted = false;
let currentLine = 0;
let isTyping = false;
let typeInterval = null;
let isChoiceActive = false;
let isTransitioning = false;
let inFollowUp = false;
let followUpIndex = 0;

let currentLetterIdx = 0;
let isLetterTyping = false;
let letterInterval = null;

let gameState = 'DIALOGUE';

const dialogBackBtn = document.getElementById('dialog-back');
const dialogNextBtn = document.getElementById('dialog-next');
const letterBackBtn = document.getElementById('letter-back');
const letterNextBtn = document.getElementById('letter-next');

const speakerNameEl = document.getElementById('speaker-name');
const dialogueTextEl = document.getElementById('dialogue-text');
const characterSpriteEl = document.getElementById('character-sprite');
const choiceContainer = document.getElementById('choice-container');
const letterContentEl = document.getElementById('letter-content');
const fadeBlackEl = document.getElementById('fade-black');
const gameContainerEl = document.getElementById('game-container');
const letterScreenEl = document.getElementById('letter-screen');
const fireworksScreenEl = document.getElementById('fireworks-screen');
const endingScreenEl = document.getElementById('ending-screen');
const fwContinueBtn = document.getElementById('fw-continue');

function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    bgm.volume = 0.6;
    bgm.play().catch(() => {});
}

function playClick() {
    clickSfx.currentTime = 0;
    clickSfx.play().catch(() => {});
}

function updateNavButtons() {
    if (gameState === 'DIALOGUE') {
        const data = story[currentLine];

        dialogBackBtn.style.display = (currentLine > 0 && !isChoiceActive && !isTransitioning) ? 'block' : 'none';

        const canNext = data && !isTyping && !isChoiceActive && !isTransitioning &&
            (data.type !== 'choice' || data.isResolved);
        dialogNextBtn.style.display = canNext ? 'block' : 'none';
    } else if (gameState === 'LETTER') {
        letterBackBtn.style.display = isTransitioning ? 'none' : 'block';
        letterNextBtn.style.display = (!isLetterTyping && !isTransitioning) ? 'block' : 'none';
    } else {
        dialogBackBtn.style.display = 'none';
        dialogNextBtn.style.display = 'none';
        letterBackBtn.style.display = 'none';
        letterNextBtn.style.display = 'none';
    }
}

const story = [
    {
        name: "Narator",
        image: "",
        text: "Hari ini adalah hari yang sangat spesial. Di dunia yang mempertemukan realita dan keajaiban Persona, Sandrina tengah merayakan ulang tahunnya yang ke-16."
    },
    {
        name: "Narator",
        image: "",
        text: "Suasana pesta terasa begitu hangat dan meriah, dihadiri oleh teman-teman dari SEES dan tentu saja, Arshavin, yang sudah mempersiapkan banyak hal untuk hari ini."
    },
    {
        name: "Junpei Iori",

    },
    {
        name: "Junpei Iori",

    },
    {
        type: "choice",
        name: "Junpei Iori",

        question: "Gimana, lo janji bakal terus berpikir positif dan tetap semangat kan?",
        rejectionCount: 0,
        followUp: [
            "Nah, gitu dong! Itu baru Sandrina yang gue kenal! Tapi serius ya, lo nggak harus selalu kuat kok. Kadang cerita ke temen itu bukan tanda lemah.",
            "Dulu gue juga sering ngerasa nggak berguna. Tapi ternyata ada aja orang yang diam-diam percaya sama kita. Dan buat kita semua, orang itu ya lo.",
            "Udah ah, nanti gue keliatan terlalu sentimental di depan Akihiko-senpai. Pokoknya nikmatin pestanya, oke? Ada ramen tuh, buruan ambil sebelum abis!"
        ],
        choices: [
            { text: "Iya, aku janji bakal selalu positif!", next: true },
            {
                text: "Nggak tau deh, rasanya capek...",
                rejectTexts: [
                    "Heeei! Nggak ada kata nolak! Lo protagonis kita, jadi lo wajib janji buat terus semangat! Ayo bilang janji!",

    },
    {
        type: "choice",
        name: "Akihiko Sanada",
        image: "akihiko.png",
        question: "Pertarunganmu yang sebenarnya baru dimulai. Janji padaku kau nggak akan pernah menyerah pada keadaan?",
        rejectionCount: 0,
        followUp: [
            "Bagus. Janji seorang petarung itu tidak boleh dilanggar.",
            "Dulu aku terlalu fokus jadi kuat sampai lupa bahwa kuat itu bukan cuma soal otot. Kuat juga berarti berani minta tolong dan berani istirahat.",
            "Kalau suatu hari kamu butuh partner latihan, atau cuma butuh teman lari pagi, bilang saja. Aku siap kapan pun."
        ],

            { text: "Tentu, aku janji nggak akan nyerah.", next: true },
            {
                text: "Tapi aku pengen nyerah aja...",

                    "Hei! Aku tidak melatihmu untuk jadi pengecut! Kau harus berjanji padaku untuk terus berjuang!",

    },
    {

    },
    {

        image: "shinjiro.png",

    },
    {
        type: "choice",
        name: "Shinjiro Aragaki",
        image: "shinjiro.png",

    {

        image: "makoto.png",
        text: "Selamat ulang tahun, Sandrina. Kau sudah bekerja sangat keras untuk menanggung semuanya sendirian."
    },
    {
        type: "choice",

function showSprite(data) {
    if (!data.image) {
        characterSpriteEl.style.opacity = 0;
        return;
    }

    const current = characterSpriteEl.getAttribute('src') || '';
    if (current === data.image) {
        characterSpriteEl.style.opacity = 1;
        return;
    }

    characterSpriteEl.style.opacity = 0;

    const img = new Image();
    const apply = () => {
        if (gameState !== 'DIALOGUE' || story[currentLine] !== data) return;
        characterSpriteEl.src = data.image;
        characterSpriteEl.style.opacity = 1;
    };
    img.onload = apply;
    img.onerror = apply;
    img.src = data.image;
}

function renderDialogue(idx) {
    const currentData = story[idx];
    if (!currentData) return;

    inFollowUp = false;
    followUpIndex = 0;

    if (currentData.type === 'choice') {
        currentData.isResolved = false;
        currentData.rejectionCount = 0;
    }

    speakerNameEl.textContent = currentData.name;
    showSprite(currentData);

    const text = currentData.type === 'choice' ? currentData.question : currentData.text;

    updateNavButtons();
    typeWriter(text, () => {
        if (currentData.type === 'choice') {
            showChoices(currentData);
        }
    });
}

function advanceDialogue(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'DIALOGUE' || isTyping || isChoiceActive || isTransitioning) return;

    startAudio();
    playClick();

    if (inFollowUp) {
        const data = story[currentLine];
        followUpIndex++;
        if (data && data.followUp && followUpIndex < data.followUp.length) {
            typeWriter(data.followUp[followUpIndex]);
            return;
        }
        inFollowUp = false;
    }

    currentLine++;

    if (currentLine >= story.length) {
        isTransitioning = true;
        updateNavButtons();

        clearInterval(typeInterval);
        fadeBlackEl.style.opacity = '1';
        dialogueTextEl.textContent = "...";
        speakerNameEl.textContent = "";

        setTimeout(() => {
            gameContainerEl.style.display = 'none';
            letterScreenEl.style.display = 'flex';
            setTimeout(() => {
                letterScreenEl.style.opacity = '1';
                gameState = 'LETTER';
                isTransitioning = false;
                currentLetterIdx = 0;
                renderLetter(currentLetterIdx);
            }, 50);
        }, 1000);
        return;
    }

    renderDialogue(currentLine);
}

function showChoices(choiceData) {
    isChoiceActive = true;
    choiceContainer.innerHTML = '';
    choiceContainer.style.display = 'flex';
    updateNavButtons();

    choiceData.choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.onclick = (e) => {
            e.stopPropagation();
            playClick();
            choiceContainer.style.display = 'none';
            isChoiceActive = false;

            if (c.next) {
                choiceData.isResolved = true;
                if (choiceData.followUp && choiceData.followUp.length > 0) {
                    inFollowUp = true;
                    followUpIndex = 0;
                    speakerNameEl.textContent = choiceData.name;
                    typeWriter(choiceData.followUp[0]);
                } else {
                    advanceDialogue();
                }
                return;
            }

            choiceData.rejectionCount += 1;
            const count = choiceData.rejectionCount;
            speakerNameEl.textContent = choiceData.name;

            if (count <= 2) {
                typeWriter(c.rejectTexts[count - 1], () => {
                    showChoices(choiceData);
                });
            } else {
                choiceData.isResolved = true;
                typeWriter(c.rejectTexts[2], () => {
                    updateNavButtons();
                });
            }
        };
        choiceContainer.appendChild(btn);
    });
}

function typeWriter(text, callback) {
    isTyping = true;
    dialogueTextEl.textContent = '';
    updateNavButtons();

    let i = 0;
    clearInterval(typeInterval);
    typeInterval = setInterval(() => {
        dialogueTextEl.textContent += text.charAt(i);
        dialogueTextEl.scrollTop = dialogueTextEl.scrollHeight;
        i++;
        if (i >= text.length) {
            clearInterval(typeInterval);
            isTyping = false;
            updateNavButtons();
            if (callback) callback();
        }
    }, 18);
}

function renderLetter(idx) {
    letterContentEl.textContent = '';
    isLetterTyping = true;
    updateNavButtons();

    const text = letters[idx];
    let i = 0;

    clearInterval(letterInterval);
    letterInterval = setInterval(() => {
        letterContentEl.textContent += text.charAt(i);
        i++;
        if (i >= text.length) {
            clearInterval(letterInterval);
            isLetterTyping = false;
            updateNavButtons();
        }
    }, 18);
}

function advanceLetter(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'LETTER' || isLetterTyping || isTransitioning) return;

    startAudio();
    playClick();
    currentLetterIdx++;

    if (currentLetterIdx >= letters.length) {
        isTransitioning = true;
        updateNavButtons();
        letterScreenEl.style.opacity = '0';

        setTimeout(() => {
            letterScreenEl.style.display = 'none';
            fireworksScreenEl.style.display = 'flex';
            setTimeout(() => {
                fireworksScreenEl.style.opacity = '1';
                gameState = 'FIREWORKS';
                isTransitioning = false;
                updateNavButtons();
                startFireworks();
                setTimeout(() => {
                    fwContinueBtn.classList.add('visible');
                }, 6000);
            }, 100);
        }, 1500);
        return;
    }

    renderLetter(currentLetterIdx);
}

function goBack(e) {
    if (e) e.stopPropagation();
    if (isTyping || isLetterTyping || isTransitioning) return;

    startAudio();
    playClick();

    if (gameState === 'DIALOGUE') {
        if (inFollowUp) {
            renderDialogue(currentLine);
            return;
        }
        if (currentLine > 0 && !isChoiceActive) {
            currentLine--;
            renderDialogue(currentLine);
        }
    } else if (gameState === 'LETTER') {
        if (currentLetterIdx > 0) {
            currentLetterIdx--;
            renderLetter(currentLetterIdx);
        } else {
            isTransitioning = true;
            updateNavButtons();
            letterScreenEl.style.opacity = '0';

            setTimeout(() => {
                letterScreenEl.style.display = 'none';
                gameContainerEl.style.display = 'flex';
                fadeBlackEl.style.opacity = '0';
                gameState = 'DIALOGUE';
                isTransitioning = false;
                currentLine = story.length - 1;
                renderDialogue(currentLine);
            }, 1000);
        }
    }
}

const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');

let fwWidth = 0;
let fwHeight = 0;
let fwRunning = false;
let fwFrame = null;
let fwLastRocket = 0;
let fwLastHeart = 0;
let fwRocketCount = 0;
let fwRockets = [];
let fwSparks = [];
let fwHearts = [];

function resizeFireworks() {
    const dpr = window.devicePixelRatio || 1;
    fwWidth = window.innerWidth;
    fwHeight = window.innerHeight;
    fwCanvas.width = Math.floor(fwWidth * dpr);
    fwCanvas.height = Math.floor(fwHeight * dpr);
    fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fwCtx.globalCompositeOperation = 'source-over';
    fwCtx.fillStyle = '#02060f';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);
}

function drawHeart(x, y, size, color, alpha) {
    fwCtx.save();
    fwCtx.globalAlpha = alpha;
    fwCtx.fillStyle = color;
    fwCtx.beginPath();
    fwCtx.moveTo(x, y + size * 0.25);
    fwCtx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.25);
    fwCtx.bezierCurveTo(x - size * 0.5, y + size * 0.5, x, y + size * 0.75, x, y + size);
    fwCtx.bezierCurveTo(x, y + size * 0.75, x + size * 0.5, y + size * 0.5, x + size * 0.5, y + size * 0.25);
    fwCtx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.25);
    fwCtx.closePath();
    fwCtx.fill();
    fwCtx.restore();
}

function spawnHeart(scatter) {
    fwHearts.push({
        x: Math.random() * fwWidth,
        y: scatter ? Math.random() * fwHeight : fwHeight + 30,
        size: 14 + Math.random() * 26,
        speed: 0.8 + Math.random() * 1.4,
        sway: 0.3 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.35 + Math.random() * 0.5,
        hue: 335 + Math.random() * 30
    });
}

function launchRocket() {
    fwRocketCount++;
    const heart = fwRocketCount % 3 === 0;
    fwRockets.push({
        x: fwWidth * (0.12 + Math.random() * 0.76),
        y: fwHeight + 10,
        vy: -(fwHeight * 0.012 + Math.random() * 2),
        targetY: fwHeight * (0.18 + Math.random() * 0.32),
        hue: heart ? 335 + Math.random() * 25 : Math.random() * 360,
        heart: heart
    });
}

function explode(x, y, hue, heart) {
    const base = Math.min(fwWidth, fwHeight);

    if (heart) {
        const k = base * 0.00058;
        const count = 72;
        for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            fwSparks.push({
                x: x,
                y: y,
                vx: hx * k,
                vy: hy * k,
                alpha: 1,
                decay: 0.008 + Math.random() * 0.004,
                hue: hue,
                size: 2.6,
                friction: 0.95,
                gravity: 0.012
            });
        }
    } else {
        const count = 70 + Math.floor(Math.random() * 30);
        const power = base * 0.0085;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = power * 0.2 + Math.random() * power;
            fwSparks.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                decay: 0.012 + Math.random() * 0.012,
                hue: hue + (Math.random() * 30 - 15),
                size: 2,
                friction: 0.96,
                gravity: 0.03
            });
        }
    }

    if (fwSparks.length > 1400) {
        fwSparks.splice(0, fwSparks.length - 1400);
    }
}

function fireworksLoop(ts) {
    if (!fwRunning) return;

    fwCtx.globalCompositeOperation = 'source-over';
    fwCtx.globalAlpha = 1;
    fwCtx.fillStyle = 'rgba(2, 6, 15, 0.2)';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);

    if (ts - fwLastRocket > 650) {
        launchRocket();
        if (Math.random() < 0.35) launchRocket();
        fwLastRocket = ts;
    }

    if (ts - fwLastHeart > 320) {
        spawnHeart(false);
        fwLastHeart = ts;
    }

    for (let i = fwHearts.length - 1; i >= 0; i--) {
        const h = fwHearts[i];
        h.y -= h.speed;
        h.phase += 0.03;
        h.x += Math.sin(h.phase) * h.sway;
        if (h.y < -h.size - 10) {
            fwHearts.splice(i, 1);
            continue;
        }
        drawHeart(h.x, h.y, h.size, 'hsl(' + h.hue + ', 90%, 62%)', h.alpha);
    }

    fwCtx.globalCompositeOperation = 'lighter';

    for (let i = fwRockets.length - 1; i >= 0; i--) {
        const r = fwRockets[i];
        r.y += r.vy;
        fwCtx.globalAlpha = 1;
        fwCtx.fillStyle = 'hsl(' + r.hue + ', 100%, 75%)';
        fwCtx.beginPath();
        fwCtx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
        fwCtx.fill();
        if (r.y <= r.targetY) {
            explode(r.x, r.y, r.hue, r.heart);
            fwRockets.splice(i, 1);
        }
    }

    for (let i = fwSparks.length - 1; i >= 0; i--) {
        const s = fwSparks[i];
        s.vx *= s.friction;
        s.vy *= s.friction;
        s.vy += s.gravity;
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= s.decay;
        if (s.alpha <= 0) {
            fwSparks.splice(i, 1);
            continue;
        }
        fwCtx.globalAlpha = s.alpha;
        fwCtx.fillStyle = 'hsl(' + s.hue + ', 100%, 65%)';
        fwCtx.beginPath();
        fwCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        fwCtx.fill();
    }

    fwCtx.globalAlpha = 1;
    fwCtx.globalCompositeOperation = 'source-over';

    fwFrame = requestAnimationFrame(fireworksLoop);
}

function startFireworks() {
    resizeFireworks();
    fwRockets = [];
    fwSparks = [];
    fwHearts = [];
    fwRocketCount = 0;
    fwContinueBtn.classList.remove('visible');

    for (let i = 0; i < 12; i++) {
        spawnHeart(true);
    }

    const now = performance.now();
    fwLastRocket = now - 600;
    fwLastHeart = now;
    fwRunning = true;
    fwFrame = requestAnimationFrame(fireworksLoop);
}

function stopFireworks() {
    fwRunning = false;
    if (fwFrame) cancelAnimationFrame(fwFrame);
    fwFrame = null;
}

function showEnding() {
    if (gameState !== 'FIREWORKS' || isTransitioning) return;

    isTransitioning = true;
    playClick();
    fireworksScreenEl.style.opacity = '0';

    setTimeout(() => {
        stopFireworks();
        fireworksScreenEl.style.display = 'none';
        endingScreenEl.style.display = 'flex';
        setTimeout(() => {
            endingScreenEl.style.opacity = '1';
            gameState = 'ENDING';
            isTransitioning = false;
            updateNavButtons();
        }, 100);
    }, 1500);
}

fireworksScreenEl.addEventListener('pointerdown', (e) => {
    if (gameState !== 'FIREWORKS' || e.target === fwContinueBtn) return;
    const heart = Math.random() < 0.5;
    explode(e.clientX, e.clientY, heart ? 335 + Math.random() * 25 : Math.random() * 360, heart);
});
