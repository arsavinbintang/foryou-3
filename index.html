* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html {

    height: 100vh;
    font-family: 'Jost', sans-serif;
    background-color: #000;
    overflow: hidden;
    user-select: none;
}

/* LAYAR LOADING */
#loading-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #001122;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #66B2FF;
    transition: opacity 0.5s ease-in-out;
}
#loading-text {
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
    animation: blink 1s infinite;
}
.loading-bar-container {
    width: 300px;
    height: 10px;
    background: #002b5e;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #66B2FF;
}
#loading-bar {
    width: 0%;
    height: 100%;
    background: #66B2FF;
    transition: width 0.3s;
}

#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url('background.png'); 
    background-size: cover;
    background-position: center;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
}

#overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0, 15, 35, 0.3) 0%, rgba(0, 10, 25, 0.6) 100%);
    z-index: 1;
}

/* PEMBUNGKUS KARAKTER & DIALOG */
#bottom-ui {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 3vh;
    z-index: 5;
}

#character-sprite {
    height: 55vh;
    max-width: 90vw;
    object-fit: contain;
    object-position: bottom center; 
    margin-bottom: -15px; 
    z-index: 3;
    transition: opacity 0.3s ease-in-out;
    filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
    opacity: 0;
}

#dialogue-box {
    position: relative;
    width: 90vw;
    max-width: 1000px;
    height: 26vh;
    min-height: 160px;
    background: linear-gradient(135deg, rgba(0, 30, 75, 0.98) 0%, rgba(0, 10, 30, 0.98) 100%);
    border: 3px solid #66B2FF;
    border-radius: 4px;
    padding: 1.8rem 2.5rem;
    z-index: 4;
    box-shadow: 0px 0px 25px rgba(102, 178, 255, 0.4);
    display: flex;
    flex-direction: column;
}

#speaker-name {
    position: absolute;
    top: -24px;
    left: -10px;
    background-color: #000;
    color: #fff;
    padding: 6px 28px;
    font-size: 1.4rem;
    font-weight: bold;
    border: 2px solid #66B2FF;
    text-transform: uppercase;
    letter-spacing: 2px;
    transform: skewX(-12deg);
    box-shadow: 3px 3px 0 #0044aa;
    z-index: 5;
}

/* NAVIGASI KANAN ATAS DIALOG (< >) */
.dialog-nav-container {
    position: absolute;
    top: -24px;
    right: -10px;
    display: flex;
    gap: 5px;
    z-index: 10;
}

.nav-btn {
    background-color: #000;
    color: #fff;
    border: 2px solid #66B2FF;
    padding: 5px 18px;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    transform: skewX(-12deg);
    box-shadow: 3px 3px 0 #0044aa;
    transition: all 0.2s;
    display: none;
}
.nav-btn:hover {
    background-color: #66B2FF;
    color: #000;
}
.nav-btn span {
    display: inline-block;
    transform: skewX(12deg); /* Meluruskan kembali simbol < > */
}

#dialogue-text {
    color: #fff;
    font-size: 1.35rem;
    line-height: 1.6;
    text-shadow: 1px 1px 3px #000;
    overflow-y: auto;
    flex-grow: 1;
    padding-right: 15px;
}
#dialogue-text::-webkit-scrollbar { width: 6px; }
#dialogue-text::-webkit-scrollbar-thumb { background: #66B2FF; border-radius: 3px; }

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

#choice-container {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    flex-direction: column;
    gap: 15px;
    z-index: 20;
    width: 80%;
    max-width: 600px;
}

.choice-btn {
    background: linear-gradient(135deg, rgba(0, 40, 100, 0.95), rgba(0, 15, 40, 0.95));
    border: 2px solid #66B2FF;
    color: #fff;
    padding: 15px 25px;
    font-size: 1.3rem;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(102, 178, 255, 0.3);

    text-align: center;
}

.choice-btn:hover {
    background: #66B2FF;
    color: #000;
    transform: scale(1.05);
}

#fade-black {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: black;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease-in-out;
}

#letter-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 20;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;

.letter-paper {
    background: #fdfbf7;
    width: 90%;
    max-width: 650px;
    padding: 40px;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
    position: relative;
    color: #333;
    font-family: 'Caveat', cursive;
    display: flex;
    flex-direction: column;
}

.letter-paper::before {
    content: '';
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 2px dashed #d1c7b7;
    border-radius: 2px;
    pointer-events: none;
}

/* NAVIGASI KANAN ATAS SURAT (< >) */
.letter-nav-container {

    top: -20px;
    right: -20px;
    display: flex;
    gap: 8px;
    z-index: 10;

    background-color: #2b2b2b;

.letter-nav-btn:hover {

#letter-content {

#ending-screen {

let loadedAssets = 0;

function preloadAssets() {
    if (assetsToLoad.length === 0) {
        finishLoading();
        return;
    }
    
    assetsToLoad.forEach(src => {
        const img = new Image();
        img.onload = () => updateLoadingProgress();
        img.onerror = () => {
            console.warn("Gagal memuat gambar: " + src + ". Pastikan nama file persis sama!");
            updateLoadingProgress(); 
        };
        img.src = src;
    });
}

function updateLoadingProgress() {
    loadedAssets++;
    let percent = Math.floor((loadedAssets / assetsToLoad.length) * 100);
    document.getElementById('loading-percent').innerText = percent + "%";
    document.getElementById('loading-bar').style.width = percent + "%";
    
    if (loadedAssets === assetsToLoad.length) {
        setTimeout(finishLoading, 500);
    }
}

function finishLoading() {
    const loader = document.getElementById('loading-screen');
    loader.style.opacity = '0';
    setTimeout(() => {
        loader.style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        renderDialogue(currentLine);

}

function updateNavButtons() {

    }

function renderDialogue(idx) {
    let currentData = story[idx];
    
    if (currentData.type === 'choice') {
        currentData.isResolved = false;
        currentData.rejectionCount = 0;
    }
    
    speakerNameEl.innerHTML = currentData.name;
    
    if (currentData.image) {
        characterSpriteEl.src = currentData.image;
        characterSpriteEl.style.opacity = 1;
    } else {
        characterSpriteEl.style.opacity = 0;
    }
    
    activeDialogueText = currentData.type === 'choice' ? currentData.question : currentData.text;

    updateNavButtons();
    typeWriter(activeDialogueText, () => {
        if (currentData.type === 'choice') {
            showChoices(currentData);
        }
    });
}

function advanceDialogue(e) {
    if (e) e.stopPropagation();
    if (isTyping || isChoiceActive) return; 
    
    if (!audioStarted) {
        bgm.volume = 0.6;
        bgm.play().catch(()=>{});
        audioStarted = true;
    }
    
    playClick();
    currentLine++;

    if (currentLine >= story.length) {
        document.getElementById('fade-black').style.opacity = '1';
        dialogueTextEl.innerHTML = "...";
        speakerNameEl.innerHTML = "";
        updateNavButtons();
        
        setTimeout(() => {
            document.getElementById('game-container').style.display = 'none';
            let letterScreen = document.getElementById('letter-screen');
            letterScreen.style.display = 'flex';
            setTimeout(() => {
                letterScreen.style.opacity = '1';
                gameState = 'LETTER';
                currentLetterIdx = 0;
                renderLetter(currentLetterIdx);
            }, 100);
        }, 1500);
        return;
    }

    renderDialogue(currentLine);
}

function showChoices(choiceData) {
    isChoiceActive = true;
    choiceContainer.innerHTML = '';
    choiceContainer.style.display = 'flex';
    updateNavButtons(); 
    
    choiceData.choices.forEach(c => {
        let btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = c.text;
        btn.onclick = (e) => {
            e.stopPropagation(); 
            playClick();
            choiceContainer.style.display = 'none';
            isChoiceActive = false;
            
            if (c.next) {
                advanceDialogue();
            } else {
                choiceData.rejectionCount += 1;
                let count = choiceData.rejectionCount;

                if (count <= 2) {
                    activeDialogueText = c.rejectTexts[count - 1];
                    speakerNameEl.innerHTML = choiceData.name;
                    typeWriter(activeDialogueText, () => {
                        showChoices(choiceData);
                    });
                } else {
                    choiceData.isResolved = true;
                    activeDialogueText = c.rejectTexts[2];
                    speakerNameEl.innerHTML = choiceData.name;
                    typeWriter(activeDialogueText, () => {
                        updateNavButtons();
                    });
                }
            }
        };
        choiceContainer.appendChild(btn);
    });
}

function typeWriter(text, callback) {
    isTyping = true;
    dialogueTextEl.innerHTML = '';
    updateNavButtons();
    
    let i = 0;
    clearInterval(typeInterval);
    typeInterval = setInterval(() => {
        dialogueTextEl.innerHTML += text.charAt(i);
        dialogueTextEl.scrollTop = dialogueTextEl.scrollHeight;
        i++;
        if (i >= text.length) {
            clearInterval(typeInterval);
            isTyping = false;
            updateNavButtons();
            if (callback) callback();
        }
    }, 18); 
}

function renderLetter(idx) {
    letterContentEl.innerHTML = '';
    isLetterTyping = true;
    updateNavButtons();
    
    let text = letters[idx];
    let i = 0;
    
    clearInterval(letterInterval);
    letterInterval = setInterval(() => {
        letterContentEl.innerHTML += text.charAt(i);
        i++;
        if (i >= text.length) {
            clearInterval(letterInterval);
            isLetterTyping = false;
            updateNavButtons();
        }
    }, 18);
}

function advanceLetter(e) {
    if (e) e.stopPropagation();
    if (isLetterTyping) return; 
    
    if (!audioStarted) {
        bgm.volume = 0.6;
        bgm.play().catch(()=>{});
        audioStarted = true;
    }
    
    playClick();
    currentLetterIdx++;

    if (currentLetterIdx >= letters.length) {
        let letterScreen = document.getElementById('letter-screen');
        letterScreen.style.opacity = '0';
        updateNavButtons();
        
        setTimeout(() => {
            letterScreen.style.display = 'none';
            let endingScreen = document.getElementById('ending-screen');
            endingScreen.style.display = 'flex';
            setTimeout(() => {
                endingScreen.style.opacity = '1';
                gameState = 'ENDING';
            }, 100);
        }, 1500);
        return;
    }

    renderLetter(currentLetterIdx);
}

function goBack(e) {
    if (e) e.stopPropagation();
    if (isTyping || isLetterTyping) return; 
    
    if (!audioStarted) {
        bgm.volume = 0.6;
        bgm.play().catch(()=>{});
        audioStarted = true;
    }
    
    playClick();

    if (gameState === 'DIALOGUE') {
        if (currentLine > 0) {
            currentLine--;
            renderDialogue(currentLine);
        }
    } else if (gameState === 'LETTER') {
        if (currentLetterIdx > 0) {
            currentLetterIdx--;
            renderLetter(currentLetterIdx);
        } else {
            let letterScreen = document.getElementById('letter-screen');
            letterScreen.style.opacity = '0';
            
            setTimeout(() => {
                letterScreen.style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                document.getElementById('fade-black').style.opacity = '0';
                gameState = 'DIALOGUE';
                currentLine = story.length - 1;
                renderDialogue(currentLine);
            }, 500);
        }
    }
}
</script>
