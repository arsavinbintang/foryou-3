<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 16th Birthday Sandrina</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,700;1,400&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body, html {
    width: 100vw; height: 100vh; height: 100dvh;
    font-family: 'Jost', sans-serif;
    background-color: #000; overflow: hidden; user-select: none;
}

#loading-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #001122; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #66B2FF; transition: opacity 0.5s ease-in-out;
}
#loading-text { font-size: 2rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; text-align: center; animation: blink 1s infinite; }
.loading-bar-container { width: 300px; max-width: 80vw; height: 10px; background: #002b5e; border-radius: 5px; overflow: hidden; border: 1px solid #66B2FF; }
#loading-bar { width: 0%; height: 100%; background: #66B2FF; transition: width 0.3s; }

#game-container {
    position: relative; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; display: none; flex-direction: column;
    justify-content: flex-end; align-items: center; background-color: #000;
}
.bg-layer {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    transition: opacity 1.2s ease-in-out; opacity: 0; z-index: 0;
}
#overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0, 15, 35, 0.25) 0%, rgba(0, 10, 25, 0.62) 100%);
    z-index: 1; pointer-events: none;
}
#bottom-ui { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 3vh; z-index: 5; }
#character-sprite {
    height: 55vh; max-width: 90vw; object-fit: contain; object-position: bottom center;
    margin-bottom: -15px; z-index: 3; transition: opacity 0.35s ease-in-out;
    filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8)); opacity: 0;
}
#dialogue-box {
    position: relative; width: 90vw; max-width: 1000px; height: 26vh; min-height: 160px;
    background: linear-gradient(135deg, rgba(0, 30, 75, 0.98) 0%, rgba(0, 10, 30, 0.98) 100%);
    border: 3px solid #66B2FF; border-radius: 4px; padding: 1.8rem 2.5rem;
    z-index: 4; box-shadow: 0px 0px 25px rgba(102, 178, 255, 0.4);
    display: flex; flex-direction: column;
}
#speaker-name {
    position: absolute; top: -24px; left: -10px;
    background-color: #000; color: #fff; padding: 5px 22px;
    font-size: 1.3rem; font-weight: bold; border: 2px solid #66B2FF;
    text-transform: uppercase; letter-spacing: 2px;
    transform: skewX(-12deg); box-shadow: 3px 3px 0 #0044aa; z-index: 5;
    max-width: calc(100% - 130px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dialog-nav-container { position: absolute; top: -22px; right: -8px; display: flex; gap: 4px; z-index: 10; }
.nav-btn {
    background-color: #000; color: #fff; border: 2px solid #66B2FF;
    padding: 3px 10px; font-family: 'Jost', sans-serif; font-size: 1.02rem;
    font-weight: bold; cursor: pointer; transform: skewX(-12deg);
    box-shadow: 3px 3px 0 #0044aa; transition: all 0.2s; display: none;
    min-width: 34px; line-height: 1.2;
}
.nav-btn:hover { background-color: #66B2FF; color: #000; }
.nav-btn span { display: inline-block; transform: skewX(12deg); }
#dialogue-text {
    color: #fff; font-size: 1.35rem; line-height: 1.6; text-shadow: 1px 1px 3px #000;
    overflow-y: auto; flex-grow: 1; padding-right: 15px;
}
#dialogue-text::-webkit-scrollbar { width: 6px; }
#dialogue-text::-webkit-scrollbar-thumb { background: #66B2FF; border-radius: 3px; }

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

#choice-container {
    position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%);
    display: none; flex-direction: column; gap: 13px; z-index: 20;
    width: 84%; max-width: 620px; max-height: 60vh; overflow-y: auto; padding: 4px;
}
.choice-btn {
    background: linear-gradient(135deg, rgba(0, 40, 100, 0.95), rgba(0, 15, 40, 0.95));
    border: 2px solid #66B2FF; color: #fff; padding: 14px 22px;
    font-size: 1.12rem; font-family: 'Jost', sans-serif; cursor: pointer;
    border-radius: 4px; box-shadow: 0 0 15px rgba(102, 178, 255, 0.3);
    transition: all 0.2s; text-align: center; line-height: 1.35;
}
.choice-btn:hover { background: #66B2FF; color: #000; transform: scale(1.04); }

#fade-black {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: black; z-index: 10; opacity: 0; pointer-events: none;
    transition: opacity 1s ease-in-out;
}

#letter-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); z-index: 20;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1s ease-in-out;
}
.letter-paper {
    background: #fdfbf7; width: 90%; max-width: 520px; padding: 25px 20px;
    border-radius: 4px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    position: relative; color: #111; font-family: 'Caveat', cursive;
    display: flex; flex-direction: column;
}
.letter-paper::before {
    content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 2px dashed #d1c7b7; border-radius: 2px; pointer-events: none;
}
.letter-nav-container { position: absolute; top: -45px; right: 0; display: flex; gap: 8px; z-index: 10; }
.letter-nav-btn {
    background-color: #2b2b2b; color: #fff; border: 2px solid #fff;
    padding: 6px 15px; font-family: 'Jost', sans-serif; font-size: 1.2rem;
    font-weight: bold; cursor: pointer; border-radius: 6px;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5); transition: all 0.2s; display: none;
}
.letter-nav-btn:hover { background-color: #e63946; color: #fff; }
#letter-content { font-size: 1.4rem; line-height: 1.4; white-space: pre-wrap; min-height: 180px; margin-top: 5px; overflow-y: auto; max-height: 60vh; }

#fireworks-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #02060f; z-index: 30; display: none;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1.5s ease-in-out;
}
#fireworks-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#fireworks-text {
    position: relative; z-index: 2; text-align: center;
    pointer-events: none; padding: 0 6vw;
    display: flex; flex-direction: column; align-items: center;
}
#fw-top {
    font-family: 'Jost', sans-serif; font-weight: 700; letter-spacing: 0.42em;
    text-transform: uppercase; color: #ffd6e5;
    font-size: clamp(0.85rem, 3.2vw, 1.5rem);
    text-shadow: 0 0 14px rgba(255, 79, 139, 0.9);
    animation: fwFadeUp 1.3s ease-out 0.4s both;
}
#fw-title {
    font-family: 'Caveat', cursive; font-weight: 700;
    font-size: clamp(3.4rem, 17vw, 8.5rem); line-height: 0.95;
    margin: 4px 0 2px;
    background: linear-gradient(90deg, #ffffff, #ffc2d6, #ffffff, #ff7aa8, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 79, 139, 0.9));
    animation: fwPop 1.5s cubic-bezier(.2,1.4,.4,1) both, fwShimmer 6s linear 1.6s infinite;
}
#fw-name {
    font-family: 'Jost', sans-serif; font-weight: 700; letter-spacing: 0.55em;
    text-transform: uppercase; color: #ffffff;
    font-size: clamp(0.9rem, 3.6vw, 1.6rem); margin-top: 10px;
    text-shadow: 0 0 16px rgba(102, 178, 255, 0.9);
    animation: fwFadeUp 1.4s ease-out 1s both;
}
#fw-sub {
    font-family: 'Jost', sans-serif; font-style: italic; color: #a9c9ff;
    font-size: clamp(0.72rem, 2.6vw, 1rem); letter-spacing: 0.12em;
    margin-top: 16px; text-shadow: 0 0 12px rgba(102, 178, 255, 0.7);
    animation: fwFadeUp 1.4s ease-out 1.8s both;
}
@keyframes fwPop { 0% { opacity: 0; transform: scale(0.35); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
@keyframes fwShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
@keyframes fwFadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

#fw-continue {
    position: absolute; bottom: 6vh; left: 50%; transform: translateX(-50%);
    z-index: 3; background: rgba(255, 79, 139, 0.15); border: 2px solid #ff7aa8;
    color: #fff; padding: 12px 36px; font-family: 'Jost', sans-serif;
    font-size: 1.05rem; font-weight: 700; letter-spacing: 2px;
    border-radius: 30px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 1s ease-in-out, background 0.2s, transform 0.2s;
}
#fw-continue.visible { opacity: 1; pointer-events: auto; animation: fwFadeUp 1s ease-out both; }
#fw-continue:hover { background: #ff4f8b; transform: translateX(-50%) scale(1.05); }

#ending-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0f; z-index: 40; display: none;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1.5s ease-in-out;
}
.ending-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
#ending-photo {
    max-height: 72vh; max-width: 85vw;
    border: 12px solid #fff; border-bottom-width: 40px; border-radius: 2px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    transform: rotate(-2deg); transition: transform 0.4s ease-out;
    background-color: #fff; object-fit: contain;
}
#ending-caption {
    color: #fff; font-family: 'Jost', sans-serif; letter-spacing: 1px;
    font-size: 1rem; opacity: 0.85; text-align: center;
    animation: fwFadeUp 1.6s ease-out 1.2s both;
}

@media (max-width: 600px) {
    #dialogue-box { padding: 1.4rem 1.1rem; }
    #dialogue-text { font-size: 1.08rem; }
    #speaker-name { font-size: 1.02rem; padding: 4px 15px; letter-spacing: 1px; max-width: calc(100% - 108px); }
    .nav-btn { font-size: 0.9rem; padding: 3px 8px; min-width: 30px; }
    #loading-text { font-size: 1.4rem; }
    .choice-btn { font-size: 1rem; padding: 12px 16px; }
}
</style>
</head>
<body>

<audio id="bgm-back" src="back.mp3" loop></audio>
<audio id="bgm" src="lagu.mp3" loop></audio>
<audio id="sfx-click" src="https://www.myinstants.com/media/sounds/click.mp3"></audio>
<audio id="sfx-kembangapi" src="kembangapi.mp3"></audio>

<div id="loading-screen">
    <div id="loading-text">Mempersiapkan Kejutan... <span id="loading-percent">0%</span></div>
    <div class="loading-bar-container">
        <div id="loading-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="bg-a" class="bg-layer"></div>
    <div id="bg-b" class="bg-layer"></div>
    <div id="overlay"></div>
    <div id="choice-container"></div>

    <div id="bottom-ui">
        <img id="character-sprite" src="" alt="">
        <div id="dialogue-box">
            <div id="speaker-name">Narator</div>
            <div class="dialog-nav-container">
                <button id="dialog-back" class="nav-btn" onclick="goBack(event)"><span>&lt;</span></button>
                <button id="dialog-next" class="nav-btn" onclick="advanceDialogue(event)"><span>&gt;</span></button>
            </div>
            <div id="dialogue-text"></div>
        </div>
    </div>

    <div id="fade-black"></div>
</div>

<div id="letter-screen">
    <div class="letter-paper">
        <div class="letter-nav-container">
            <button id="letter-back" class="letter-nav-btn" onclick="goBack(event)">&lt;</button>
            <button id="letter-next" class="letter-nav-btn" onclick="advanceLetter(event)">&gt;</button>
        </div>
        <div id="letter-content"></div>
    </div>
</div>

<div id="fireworks-screen">
    <canvas id="fireworks-canvas"></canvas>
    <div id="fireworks-text">
        <div id="fw-top">Selamat Ulang Tahun</div>
        <div id="fw-title">Sandrina</div>
        <div id="fw-name">Sweet Sixteen</div>
        <div id="fw-sub">Semoga bahagia selalu, ya. Kamu berharga.</div>
    </div>
    <button id="fw-continue" onclick="startEpilogue()">Lanjut</button>
</div>

<div id="ending-screen">
    <div class="ending-wrap">
        <img id="ending-photo" src="foto-akhir.png" alt="Foto Kenangan">
        <div id="ending-caption">Terima kasih sudah bermain, Sandrina. 💙</div>
    </div>
</div>

<script>
const imageAssets = [
    'udinus.jpg', 'background.png', 'junpei.png', 'akihiko.png',
    'shinjiro.png', 'makoto.png', 'koromaru.png', 'yukari.png', 'foto-akhir.png'
];
const audioAssets = ['back.mp3', 'lagu.mp3', 'kembangapi.mp3'];

let loadedAssets = 0;
const totalAssets = imageAssets.length + audioAssets.length;
let loadingFinished = false;

function bumpProgress() {
    loadedAssets++;
    const percent = Math.min(100, Math.floor((loadedAssets / totalAssets) * 100));
    document.getElementById('loading-percent').textContent = percent + '%';
    document.getElementById('loading-bar').style.width = percent + '%';
    if (loadedAssets >= totalAssets) setTimeout(finishLoading, 400);
}

function preloadAssets() {
    imageAssets.forEach(src => {
        const img = new Image();
        let done = false;
        const ok = () => { if (done) return; done = true; bumpProgress(); };
        img.onload = ok;
        img.onerror = () => { console.warn('Gagal memuat gambar: ' + src); ok(); };
        img.src = src;
    });

    audioAssets.forEach(src => {
        const a = new Audio();
        let done = false;
        const ok = () => { if (done) return; done = true; bumpProgress(); };
        a.addEventListener('canplaythrough', ok, { once: true });
        a.addEventListener('loadeddata', ok, { once: true });
        a.addEventListener('error', () => { console.warn('Gagal memuat audio: ' + src); ok(); }, { once: true });
        a.preload = 'auto';
        a.src = src;
        try { a.load(); } catch (e) {}
        setTimeout(ok, 6000);
    });

    setTimeout(finishLoading, 14000);
}

function finishLoading() {
    if (loadingFinished) return;
    loadingFinished = true;
    const loader = document.getElementById('loading-screen');
    loader.style.opacity = '0';
    setTimeout(() => {
        loader.style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        renderDialogue(currentLine);
    }, 400);
}

window.addEventListener('load', preloadAssets);

const backBgm = document.getElementById('bgm-back');
const personaBgm = document.getElementById('bgm');
const clickSfx = document.getElementById('sfx-click');
const kembangapiSfx = document.getElementById('sfx-kembangapi');

let audioStarted = false;
let personaMusicStarted = false;

function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    backBgm.volume = 0.5;
    backBgm.play().catch(() => {});
}

function playClick() {
    try { clickSfx.currentTime = 0; clickSfx.play().catch(() => {}); } catch (e) {}
}

function playKembangapi() {
    try { kembangapiSfx.currentTime = 0; kembangapiSfx.volume = 0.7; kembangapiSfx.loop = true; kembangapiSfx.play().catch(() => {}); } catch (e) {}
}

function stopKembangapi() {
    try { kembangapiSfx.pause(); kembangapiSfx.currentTime = 0; } catch (e) {}
}

function switchToPersonaMusic() {
    if (personaMusicStarted) return;
    personaMusicStarted = true;

    let v = backBgm.volume;
    const fadeOut = setInterval(() => {
        v -= 0.05;
        if (v <= 0) { backBgm.volume = 0; backBgm.pause(); clearInterval(fadeOut); }
        else { backBgm.volume = v; }
    }, 60);

    personaBgm.volume = 0;
    personaBgm.play().catch(() => {});
    let lv = 0;
    const fadeIn = setInterval(() => {
        lv += 0.04;
        if (lv >= 0.6) { personaBgm.volume = 0.6; clearInterval(fadeIn); }
        else { personaBgm.volume = lv; }
    }, 60);
}

document.addEventListener('pointerdown', startAudio, { once: true });

let currentLine = 0;
let isTyping = false;
let typeInterval = null;
let isChoiceActive = false;
let isTransitioning = false;
let inFollowUp = false;
let followUpIndex = 0;

let currentLetterIdx = 0;
let isLetterTyping = false;
let letterInterval = null;

let gameState = 'DIALOGUE';
let inEpilogue = false;

const dialogBackBtn = document.getElementById('dialog-back');
const dialogNextBtn = document.getElementById('dialog-next');
const letterBackBtn = document.getElementById('letter-back');
const letterNextBtn = document.getElementById('letter-next');

const speakerNameEl = document.getElementById('speaker-name');
const dialogueTextEl = document.getElementById('dialogue-text');
const characterSpriteEl = document.getElementById('character-sprite');
const choiceContainer = document.getElementById('choice-container');
const letterContentEl = document.getElementById('letter-content');
const fadeBlackEl = document.getElementById('fade-black');
const gameContainerEl = document.getElementById('game-container');
const letterScreenEl = document.getElementById('letter-screen');
const fireworksScreenEl = document.getElementById('fireworks-screen');
const endingScreenEl = document.getElementById('ending-screen');
const fwContinueBtn = document.getElementById('fw-continue');

const bgA = document.getElementById('bg-a');
const bgB = document.getElementById('bg-b');
bgA.style.backgroundImage = "url('udinus.jpg')";
bgA.style.opacity = '1';
let activeBg = bgA;
let inactiveBg = bgB;
let currentBgSrc = 'udinus.jpg';

function setBackground(src) {
    if (!src) src = 'background.png';
    if (src === currentBgSrc) return;
    currentBgSrc = src;
    inactiveBg.style.backgroundImage = "url('" + src + "')";
    inactiveBg.style.opacity = '1';
    activeBg.style.opacity = '0';
    const tmp = activeBg;
    activeBg = inactiveBg;
    inactiveBg = tmp;
}

const story = [
    { bg: 'udinus.jpg', name: 'Narator', image: '', text: 'Sore itu, bel sekolah berbunyi di SMKN 10 Semarang dan SMA 14 Semarang hampir bersamaan. Arshavin dan Sandrina sudah janji untuk ketemuan bareng—bukan di mie ayam, tapi ke tempat yang sudah mereka sepakati sejak pagi: kampus UDINUS.' },
    { bg: 'udinus.jpg', name: 'Narator', image: '', text: 'Langit di atas Semarang berwarna keemasan. Angin berhembus lembut, membawa aroma rumput dan aspal yang baru saja diguyur hujan sore. Arshavin tiba lebih dulu, duduk di bangku dekat gerbang UDINUS dengan tas masih di pundak.' },
    { bg: 'udinus.jpg', name: 'Narator', image: '', text: 'Tak lama kemudian, Sandrina datang. Seragamnya masih rapi, tapi wajahnya jelas menyimpan rasa penasaran bercampur lelah setelah seharian belajar.' },
    { bg: 'udinus.jpg', name: 'Arshavin', image: '', text: 'San! Sini! Aku udah nungguin dari tadi.' },
    { bg: 'udinus.jpg', name: 'Sandrina', image: '', text: 'Iya, iya. Maaf, tadi gurunya keluar kelas telat. Kamu udah lama?' },
    { bg: 'udinus.jpg', name: 'Arshavin', image: '', text: 'Nggak lama, kok. Paling... setengah jam. Hehe.' },
    { bg: 'udinus.jpg', name: 'Sandrina', image: '', text: 'Setengah jam?! Kamu bilang "sebentar" di chat tadi!' },
    { bg: 'udinus.jpg', name: 'Arshavin', image: '', text: 'Ya... daripada kamu nungguin, mending aku yang nungguin duluan, kan? Lagian aku nggak keberatan, kok. Pemandangan UDINUS sore ini lumayan buat ngabisin waktu.' },
    {
        type: 'choice', bg: 'udinus.jpg', name: 'Arshavin', image: '',
        question: 'Ngomong-ngomong... kamu masih sempet nggak? Aku mau ngajak kamu ke suatu tempat.',
        choices: [
            { text: 'Sempet, kok. Memangnya mau ke mana?', reply: 'Ada satu tempat di sekitar UDINUS ini yang... nggak semua orang bisa lihat. Aku nemu kemarin sore, dan langsung kepikiran kamu.' },
            { text: 'Tergantung. Kalau jauh, aku nolak.', reply: 'Nggak jauh, kok! Beneran. Masih di area kampus. Tapi... tempatnya agak aneh. Kamu harus lihat sendiri buat percaya.' },
            { text: 'Kamu aneh deh, ngajak aku ke UDINUS cuma buat jalan-jalan.', reply: 'Hahaha, jujur aja aku juga bingung mau ngomong apa. Tapi percaya deh, ini bukan jalan-jalan biasa. Ini bakal jadi sore yang nggak akan kamu lupain.' }
        ]
    },
    { bg: 'udinus.jpg', name: 'Arshavin', image: '', text: 'Aku nemu sesuatu kemarin. Di koridor belakang gedung, deket tangga darurat. Ada... cahaya aneh. Kayak pintu, tapi bukan pintu.' },
    { bg: 'udinus.jpg', name: 'Sandrina', image: '', text: 'Maksudmu... pintu ke dunia lain? Kamu lagi baca novel fantasi ya? Atau habis main game seharian?' },
    {
        type: 'choice', bg: 'udinus.jpg', name: 'Arshavin', image: '',
        question: 'Kamu percaya nggak sama cerita yang kayak gitu?',
        choices: [
            { text: 'Nggak percaya. Tapi ya udah, aku percaya sama kamu.', reply: 'Itu udah cukup buat aku. Kadang, percaya sama orang yang kita sayang itu lebih penting daripada percaya sama cerita aneh. Ayo, kita ke sana bareng.' },
            { text: 'Kalau kamu bilang begitu, aku mau lihat sendiri.', reply: 'Bagus! Rasa penasaran itu pintu pertama. Jangan berkedip, ya. Kita udah dekat.' },
            { text: 'Ini pasti cuma alasan biar aku jalan bareng kamu, ya?', reply: 'E-eh... nggak, kok! Maksudku... ya, setengah-setengah benarnya, sih. Hehe. Tapi beneran, ada sesuatu di sana. Aku nggak akan bikin kamu buang waktu.' }
        ]

function updateNavButtons() {
    if (gameState === 'DIALOGUE') {
        const data = currentScript[currentLine];
        dialogBackBtn.style.display = (currentLine > 0 && !isChoiceActive && !isTransitioning) ? 'block' : 'none';
        const canNext = data && !isTyping && !isChoiceActive && !isTransitioning &&
            (data.type !== 'choice' || data.isResolved);
        dialogNextBtn.style.display = canNext ? 'block' : 'none';
    } else if (gameState === 'LETTER') {
        letterBackBtn.style.display = isTransitioning ? 'none' : 'block';
        letterNextBtn.style.display = (!isLetterTyping && !isTransitioning) ? 'block' : 'none';
    } else {
        dialogBackBtn.style.display = 'none';
        dialogNextBtn.style.display = 'none';
        letterBackBtn.style.display = 'none';
        letterNextBtn.style.display = 'none';
    }
}

function showSprite(data) {
    if (!data.image) { characterSpriteEl.style.opacity = 0; return; }
    const current = characterSpriteEl.getAttribute('src') || '';
    if (current === data.image) { characterSpriteEl.style.opacity = 1; return; }
    characterSpriteEl.style.opacity = 0;
    const img = new Image();
    const apply = () => {
        if (gameState !== 'DIALOGUE' || currentScript[currentLine] !== data) return;
        characterSpriteEl.src = data.image;
        characterSpriteEl.style.opacity = 1;
    };
    img.onload = apply;
    img.onerror = apply;
    img.src = data.image;
}

function renderDialogue(idx) {
    const currentData = currentScript[idx];
    if (!currentData) return;

    if (currentData.music === 'persona') switchToPersonaMusic();
    setBackground(currentData.bg || 'background.png');

    inFollowUp = false;
    followUpIndex = 0;
    isChoiceActive = false;
    choiceContainer.style.display = 'none';

    if (currentData.type === 'choice') {
        currentData.isResolved = false;
        currentData.rejectionCount = 0;
    }

    speakerNameEl.textContent = currentData.name;
    showSprite(currentData);

    const text = currentData.type === 'choice' ? currentData.question : currentData.text;
    updateNavButtons();
    typeWriter(text, () => {
        if (currentData.type === 'choice') showChoices(currentData);
    });
}

function typeWriter(text, callback) {
    isTyping = true;
    dialogueTextEl.textContent = '';
    updateNavButtons();
    let i = 0;
    clearInterval(typeInterval);
    typeInterval = setInterval(() => {
        dialogueTextEl.textContent += text.charAt(i);
        dialogueTextEl.scrollTop = dialogueTextEl.scrollHeight;
        i++;
        if (i >= text.length) {
            clearInterval(typeInterval);
            isTyping = false;
            updateNavButtons();
            if (callback) callback();
        }
    }, 16);
}

function advanceDialogue(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'DIALOGUE' || isTyping || isChoiceActive || isTransitioning) return;

    startAudio();
    playClick();

    if (inFollowUp) {
        const data = currentScript[currentLine];
        followUpIndex++;
        if (data && data.followUp && followUpIndex < data.followUp.length) {
            typeWriter(data.followUp[followUpIndex]);
            return;
        }
        inFollowUp = false;
    }

    currentLine++;

    if (currentLine >= currentScript.length) {
        if (inEpilogue) { showEndingPhoto(); return; }

        isTransitioning = true;
        updateNavButtons();
        clearInterval(typeInterval);
        fadeBlackEl.style.opacity = '1';
        dialogueTextEl.textContent = '...';
        speakerNameEl.textContent = '';

        setTimeout(() => {
            gameContainerEl.style.display = 'none';
            letterScreenEl.style.display = 'flex';
            setTimeout(() => {
                letterScreenEl.style.opacity = '1';
                gameState = 'LETTER';
                isTransitioning = false;
                currentLetterIdx = 0;
                renderLetter(currentLetterIdx);
            }, 50);
        }, 1000);
        return;
    }

    renderDialogue(currentLine);
}

function showChoices(choiceData) {
    isChoiceActive = true;
    choiceContainer.innerHTML = '';
    choiceContainer.style.display = 'flex';
    updateNavButtons();

    choiceData.choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.onclick = (e) => {
            e.stopPropagation();
            playClick();
            choiceContainer.style.display = 'none';
            isChoiceActive = false;

            if (c.next) {
                choiceData.isResolved = true;
                if (choiceData.followUp && choiceData.followUp.length > 0) {
                    inFollowUp = true;
                    followUpIndex = 0;
                    speakerNameEl.textContent = choiceData.name;
                    typeWriter(choiceData.followUp[0]);
                } else {
                    advanceDialogue();
                }
                return;
            }

            if (c.reply) {
                choiceData.isResolved = true;
                speakerNameEl.textContent = choiceData.name;
                typeWriter(c.reply, () => { updateNavButtons(); });
                return;
            }

            choiceData.rejectionCount += 1;
            const count = choiceData.rejectionCount;
            speakerNameEl.textContent = choiceData.name;

            if (count <= 2) {
                typeWriter(c.rejectTexts[count - 1], () => { showChoices(choiceData); });
            } else {
                choiceData.isResolved = true;
                typeWriter(c.rejectTexts[2], () => { updateNavButtons(); });
            }
        };
        choiceContainer.appendChild(btn);
    });
}

function renderLetter(idx) {
    letterContentEl.textContent = '';
    isLetterTyping = true;
    updateNavButtons();
    const text = letters[idx];
    let i = 0;
    clearInterval(letterInterval);
    letterInterval = setInterval(() => {
        letterContentEl.textContent += text.charAt(i);
        i++;
        if (i >= text.length) {
            clearInterval(letterInterval);
            isLetterTyping = false;
            updateNavButtons();
        }
    }, 16);
}

function advanceLetter(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'LETTER' || isLetterTyping || isTransitioning) return;

    startAudio();
    playClick();
    currentLetterIdx++;

    if (currentLetterIdx >= letters.length) {
        isTransitioning = true;
        updateNavButtons();
        letterScreenEl.style.opacity = '0';

        setTimeout(() => {
            letterScreenEl.style.display = 'none';
            fireworksScreenEl.style.display = 'flex';
            setTimeout(() => {
                fireworksScreenEl.style.opacity = '1';
                gameState = 'FIREWORKS';
                isTransitioning = false;
                updateNavButtons();
                startFireworks();
                setTimeout(() => {
                    fwContinueBtn.classList.add('visible');
                }, 6500);
            }, 100);
        }, 1500);
        return;
    }

    renderLetter(currentLetterIdx);
}

function goBack(e) {
    if (e) e.stopPropagation();
    if (isTyping || isLetterTyping || isTransitioning) return;

    startAudio();
    playClick();

    if (gameState === 'DIALOGUE') {
        if (isChoiceActive) return;
        if (inFollowUp) { renderDialogue(currentLine); return; }
        if (currentLine > 0) { currentLine--; renderDialogue(currentLine); }
    } else if (gameState === 'LETTER') {
        if (currentLetterIdx > 0) {
            currentLetterIdx--;
            renderLetter(currentLetterIdx);
        } else {
            isTransitioning = true;
            updateNavButtons();
            letterScreenEl.style.opacity = '0';

            setTimeout(() => {
                letterScreenEl.style.display = 'none';
                gameContainerEl.style.display = 'flex';
                fadeBlackEl.style.opacity = '0';
                gameState = 'DIALOGUE';
                isTransitioning = false;
                currentScript = story;
                currentLine = story.length - 1;
                inEpilogue = false;
                renderDialogue(currentLine);
            }, 1000);
        }
    }
}

const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');

let fwWidth = 0, fwHeight = 0, fwRunning = false, fwFrame = null;
let fwLastRocket = 0, fwLastHeart = 0, fwLastGlitter = 0, fwRocketCount = 0;
let fwRockets = [], fwSparks = [], fwHearts = [], fwStars = [], fwGlitters = [];

function resizeFireworks() {
    const dpr = window.devicePixelRatio || 1;
    fwWidth = window.innerWidth;
    fwHeight = window.innerHeight;
    fwCanvas.width = Math.floor(fwWidth * dpr);
    fwCanvas.height = Math.floor(fwHeight * dpr);
    fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fwCtx.globalCompositeOperation = 'source-over';
    fwCtx.fillStyle = '#02060f';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);
}

function initStars() {
    fwStars = [];
    for (let i = 0; i < 110; i++) {
        fwStars.push({
            x: Math.random() * fwWidth, y: Math.random() * fwHeight * 0.78,
            r: 0.35 + Math.random() * 1.5, p: Math.random() * Math.PI * 2,
            s: 0.012 + Math.random() * 0.028
        });
    }
}

function drawHeart(x, y, size, color, alpha) {
    fwCtx.save();
    fwCtx.globalAlpha = alpha;
    fwCtx.fillStyle = color;
    fwCtx.beginPath();
    fwCtx.moveTo(x, y + size * 0.25);
    fwCtx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.25);
    fwCtx.bezierCurveTo(x - size * 0.5, y + size * 0.5, x, y + size * 0.75, x, y + size);
    fwCtx.bezierCurveTo(x, y + size * 0.75, x + size * 0.5, y + size * 0.5, x + size * 0.5, y + size * 0.25);
    fwCtx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.25);
    fwCtx.closePath();
    fwCtx.fill();
    fwCtx.restore();
}

function spawnHeart(scatter) {
    fwHearts.push({
        x: Math.random() * fwWidth,
        y: scatter ? Math.random() * fwHeight : fwHeight + 30,
        size: 12 + Math.random() * 26, speed: 0.7 + Math.random() * 1.5,
        sway: 0.3 + Math.random() * 0.7, phase: Math.random() * Math.PI * 2,
        alpha: 0.32 + Math.random() * 0.55, hue: 330 + Math.random() * 35
    });
}

function pushSpark(x, y, vx, vy, hue, size, decay, friction, gravity, trail) {
    fwSparks.push({ x, y, px: x, py: y, vx, vy, alpha: 1, decay, hue, size, friction, gravity, trail });
}

function launchRocket() {
    fwRocketCount++;
    let type = 'burst';
    const m = fwRocketCount % 7;
    if (m === 0) type = 'heart';
    else if (m === 2) type = 'ring';
    else if (m === 4) type = 'double';
    else if (m === 6) type = 'palm';
    const hue = type === 'heart' ? 335 + Math.random() * 25 : Math.random() * 360;
    fwRockets.push({
        x: fwWidth * (0.08 + Math.random() * 0.84), y: fwHeight + 10,
        vy: -(fwHeight * 0.0125 + Math.random() * 2.2),
        targetY: fwHeight * (0.15 + Math.random() * 0.35), hue, type
    });
}

function explode(x, y, hue, type) {
    const base = Math.min(fwWidth, fwHeight);
    const power = base * 0.0088;

    if (type === 'heart') {
        const k = base * 0.00062, count = 78;
        for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            pushSpark(x, y, hx * k, hy * k, hue, 2.6, 0.0075 + Math.random() * 0.004, 0.95, 0.012, true);
        }
    } else if (type === 'ring') {
        const count = 70, speed = power * 1.1;
        for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2;
            pushSpark(x, y, Math.cos(a) * speed, Math.sin(a) * speed, hue + (Math.random() * 16 - 8), 2.2, 0.009 + Math.random() * 0.004, 0.965, 0.012, true);
        }
    } else if (type === 'double') {
        const count = 48;
        for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2;
            pushSpark(x, y, Math.cos(a) * power * 0.62, Math.sin(a) * power * 0.62, hue, 2.1, 0.0095, 0.96, 0.014, true);
            pushSpark(x, y, Math.cos(a + 0.06) * power * 1.12, Math.sin(a + 0.06) * power * 1.12, hue + 40, 2.4, 0.0085, 0.965, 0.011, true);
        }
    } else if (type === 'palm') {
        const count = 42;
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = power * 0.35 + Math.random() * power * 0.75;
            pushSpark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, hue + (Math.random() * 26 - 13), 2.4, 0.0055, 0.985, 0.028, true);
        }
    } else {
        const count = 78 + Math.floor(Math.random() * 34);
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = power * 0.18 + Math.random() * power;
            pushSpark(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, hue + (Math.random() * 34 - 17), 1.9 + Math.random() * 0.8, 0.011 + Math.random() * 0.012, 0.958, 0.03, true);
        }
    }

    for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = power * 0.2 + Math.random() * power * 0.5;
        pushSpark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 48 + Math.random() * 12, 1.6, 0.014, 0.97, 0.02, false);
    }

    if (fwSparks.length > 1800) fwSparks.splice(0, fwSparks.length - 1800);
}

function spawnGlitter() {
    fwGlitters.push({
        x: Math.random() * fwWidth, y: -10,
        vx: (Math.random() - 0.5) * 0.6, vy: 0.7 + Math.random() * 1.2,
        size: 1 + Math.random() * 2.2, alpha: 0.6 + Math.random() * 0.4,
        hue: 40 + Math.random() * 20, phase: Math.random() * Math.PI * 2
    });
}

function fireworksLoop(ts) {
    if (!fwRunning) return;

    fwCtx.globalCompositeOperation = 'source-over';
    fwCtx.globalAlpha = 1;
    fwCtx.fillStyle = 'rgba(2, 6, 15, 0.19)';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);

    for (let i = 0; i < fwStars.length; i++) {
        const st = fwStars[i];
        st.p += st.s;
        fwCtx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(st.p));
        fwCtx.fillStyle = '#cfe6ff';
        fwCtx.beginPath();
        fwCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        fwCtx.fill();
    }
    fwCtx.globalAlpha = 1;

    if (ts - fwLastRocket > 520) {
        launchRocket();
        if (Math.random() < 0.45) launchRocket();
        if (Math.random() < 0.25) launchRocket();
        fwLastRocket = ts;
    }
    if (ts - fwLastHeart > 300) {
        spawnHeart(false);
        if (Math.random() < 0.5) spawnHeart(false);
        fwLastHeart = ts;
    }
    if (ts - fwLastGlitter > 260) {
        spawnGlitter();
        if (Math.random() < 0.6) spawnGlitter();
        fwLastGlitter = ts;
    }

    for (let i = fwHearts.length - 1; i >= 0; i--) {
        const h = fwHearts[i];
        h.y -= h.speed;
        h.phase += 0.03;
        h.x += Math.sin(h.phase) * h.sway;
        if (h.y < -h.size - 10) { fwHearts.splice(i, 1); continue; }
        drawHeart(h.x, h.y, h.size, 'hsl(' + h.hue + ', 92%, 64%)', h.alpha);
    }

    fwCtx.globalCompositeOperation = 'lighter';
    for (let i = fwGlitters.length - 1; i >= 0; i--) {
        const g = fwGlitters[i];
        g.phase += 0.06;
        g.x += g.vx + Math.sin(g.phase) * 0.4;
        g.y += g.vy;
        g.alpha -= 0.0025;
        if (g.y > fwHeight + 20 || g.alpha <= 0) { fwGlitters.splice(i, 1); continue; }
        fwCtx.globalAlpha = Math.max(0, g.alpha);
        fwCtx.fillStyle = 'hsl(' + g.hue + ', 100%, 70%)';
        fwCtx.beginPath();
        fwCtx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
        fwCtx.fill();
    }

    for (let i = fwRockets.length - 1; i >= 0; i--) {
        const r = fwRockets[i];
        const prevY = r.y;
        r.y += r.vy;
        fwCtx.globalAlpha = 1;
        fwCtx.strokeStyle = 'hsl(' + r.hue + ', 100%, 78%)';
        fwCtx.lineWidth = 2.2;
        fwCtx.beginPath();
        fwCtx.moveTo(r.x, prevY);
        fwCtx.lineTo(r.x, r.y);
        fwCtx.stroke();
        fwCtx.fillStyle = '#ffffff';
        fwCtx.beginPath();
        fwCtx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
        fwCtx.fill();
        if (r.y <= r.targetY) { explode(r.x, r.y, r.hue, r.type); fwRockets.splice(i, 1); }
    }

    for (let i = fwSparks.length - 1; i >= 0; i--) {
        const s = fwSparks[i];
        s.px = s.x; s.py = s.y;
        s.vx *= s.friction; s.vy *= s.friction; s.vy += s.gravity;
        s.x += s.vx; s.y += s.vy;
        s.alpha -= s.decay;
        if (s.alpha <= 0) { fwSparks.splice(i, 1); continue; }
        fwCtx.globalAlpha = s.alpha;
        if (s.trail) {
            fwCtx.strokeStyle = 'hsl(' + s.hue + ', 100%, 66%)';
            fwCtx.lineWidth = Math.max(0.5, s.size * 0.85);
            fwCtx.beginPath();
            fwCtx.moveTo(s.px, s.py);
            fwCtx.lineTo(s.x, s.y);
            fwCtx.stroke();
        } else {
            fwCtx.fillStyle = 'hsl(' + s.hue + ', 100%, 70%)';
            fwCtx.beginPath();
            fwCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            fwCtx.fill();
        }
    }

    fwCtx.globalAlpha = 1;
    fwCtx.globalCompositeOperation = 'source-over';
    fwFrame = requestAnimationFrame(fireworksLoop);
}

function startFireworks() {
    resizeFireworks();
    initStars();
    fwRockets = []; fwSparks = []; fwHearts = []; fwGlitters = [];
    fwRocketCount = 0;
    fwContinueBtn.classList.remove('visible');
    for (let i = 0; i < 16; i++) spawnHeart(true);
    const now = performance.now();
    fwLastRocket = now - 600;
    fwLastHeart = now;
    fwLastGlitter = now;
    fwRunning = true;
    playKembangapi();
    fwFrame = requestAnimationFrame(fireworksLoop);
}

function stopFireworks() {
    fwRunning = false;
    if (fwFrame) cancelAnimationFrame(fwFrame);
    fwFrame = null;
    stopKembangapi();
}

function startEpilogue() {
    if (gameState !== 'FIREWORKS' || isTransitioning) return;
    isTransitioning = true;
    playClick();
    fireworksScreenEl.style.opacity = '0';

    setTimeout(() => {
        stopFireworks();
        fireworksScreenEl.style.display = 'none';
        gameContainerEl.style.display = 'flex';
        currentScript = epilogue;
        currentLine = 0;
        inEpilogue = true;
        isTransitioning = false;
        gameState = 'DIALOGUE';
        setBackground('udinus.jpg');
        fadeBlackEl.style.opacity = '0';
        choiceContainer.style.display = 'none';
        renderDialogue(0);
    }, 1500);
}

function showEndingPhoto() {
    isTransitioning = true;
    updateNavButtons();
    fadeBlackEl.style.opacity = '1';

    setTimeout(() => {
        gameContainerEl.style.display = 'none';
        endingScreenEl.style.display = 'flex';
        setTimeout(() => {
            endingScreenEl.style.opacity = '1';
            gameState = 'ENDING';
            isTransitioning = false;
            updateNavButtons();
        }, 100);
    }, 1100);
}

fireworksScreenEl.addEventListener('pointerdown', (e) => {
    if (gameState !== 'FIREWORKS' || e.target === fwContinueBtn) return;
    const types = ['burst', 'heart', 'ring', 'palm', 'double'];
    const t = types[Math.floor(Math.random() * types.length)];
    const hue = t === 'heart' ? 335 + Math.random() * 25 : Math.random() * 360;
    explode(e.clientX, e.clientY, hue, t);
});

window.addEventListener('resize', () => {
    if (fwRunning) { resizeFireworks(); initStars(); }
});
</script>
</body>
